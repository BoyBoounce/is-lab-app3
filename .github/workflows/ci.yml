name: CI Build Test Docker GHCR

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

env:
  DOTNET_VERSION: '8.0.x'
  IMAGE_NAME: ghcr.io/boyboounce/is-lab-app3

jobs:
  build-test-and-publish:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore application
        run: dotnet restore IsLabApp.csproj

      - name: Restore tests
        run: dotnet restore tests/IsLabApp.Tests/IsLabApp.Tests.csproj

      - name: Build application
        run: dotnet build IsLabApp.csproj --configuration Release --no-restore

      - name: Build tests
        run: dotnet build tests/IsLabApp.Tests/IsLabApp.Tests.csproj --configuration Release --no-restore

      - name: Run tests
        run: dotnet test tests/IsLabApp.Tests/IsLabApp.Tests.csproj --configuration Release --no-build --verbosity normal

      - name: Set short SHA
        id: vars
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Docker image for pull requests
        if: github.event_name == 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}

      - name: Build and push Docker image to GHCR
        if: github.event_name == 'push'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.short_sha }}
